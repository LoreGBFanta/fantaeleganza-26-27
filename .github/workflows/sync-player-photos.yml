name: Sync verified player photos

on:
  push:
    branches: [ main ]
    paths:
      - "static/players/manifest.csv"
      - ".github/workflows/sync-player-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified reusable photos
        shell: python
        run: |
          import csv, pathlib, urllib.request
          manifest = pathlib.Path("static/players/manifest.csv")
          outdir = pathlib.Path("static/players")
          allowed = ("CC0", "CC BY", "CC-BY", "PUBLIC DOMAIN")
          rows = list(csv.DictReader(manifest.open(encoding="utf-8-sig", newline="")))
          changed = False
          for r in rows:
              status = (r.get("stato") or "").strip()
              license_name = (r.get("licenza") or "").strip().upper()
              source = (r.get("fonte") or "").strip()
              pid = (r.get("player_id") or "").strip()
              target = outdir / f"{pid}.jpg"
              if target.exists() or not source or not any(x in license_name for x in allowed):
                  continue
              if "commons.wikimedia.org/wiki/File:" not in source:
                  continue
              filename = source.split("/wiki/File:",1)[1]
              url = "https://commons.wikimedia.org/wiki/Special:Redirect/file/" + filename
              req = urllib.request.Request(url, headers={"User-Agent":"FantaEleganzaPhotoSync/1.0"})
              try:
                  data = urllib.request.urlopen(req, timeout=30).read()
                  if len(data) < 5000:
                      raise ValueError("download troppo piccolo")
                  target.write_bytes(data)
                  r["file"] = target.name
                  r["stato"] = "SCARICATA"
                  changed = True
                  print("OK", pid, len(data))
              except Exception as e:
                  print("SKIP", pid, e)
          if changed:
              fields = rows[0].keys()
              with manifest.open("w", encoding="utf-8", newline="") as f:
                  w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)

      - name: Commit downloaded assets
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No new photos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/players
          git commit -m "Sync verified player photos"
          git push
