name: Populate verified player photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/player-photos.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Commons photos
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request

          photos = {
              "6320": "File:Danilho Doekhi.jpg",
          }
          allowed = ("cc0", "public domain", "cc by", "cc-by", "cc by-sa", "cc-by-sa")
          out = pathlib.Path("static/players")
          out.mkdir(parents=True, exist_ok=True)

          for player_id, title in photos.items():
              q = urllib.parse.urlencode({
                  "action": "query",
                  "format": "json",
                  "prop": "imageinfo",
                  "titles": title,
                  "iiprop": "url|extmetadata",
                  "iiurlwidth": "500",
                  "iiextmetadatafilter": "LicenseShortName|LicenseUrl|Artist|AttributionRequired",
              })
              api = "https://commons.wikimedia.org/w/api.php?" + q
              req = urllib.request.Request(api, headers={"User-Agent":"FantaEleganzaPhotoArchive/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              page = next(iter(data["query"]["pages"].values()))
              info = page["imageinfo"][0]
              meta = info.get("extmetadata", {})
              lic = str(meta.get("LicenseShortName", {}).get("value", "")).lower()
              if not any(x in lic for x in allowed):
                  raise RuntimeError(f"{title}: licenza non ammessa: {lic!r}")
              url = info.get("thumburl") or info["url"]
              dest = out / f"{player_id}.jpg"
              req = urllib.request.Request(url, headers={"User-Agent":"FantaEleganzaPhotoArchive/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  dest.write_bytes(r.read())
              print(player_id, title, lic, url)
          PY
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/players
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add verified player photos"
            git push
          fi
